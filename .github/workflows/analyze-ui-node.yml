name: L2NR UI node

on:
  workflow_call:
    inputs:
      command:
        description: Inspect the project or build a display-only node
        required: false
        type: string
        default: inspect
      artifact_name:
        description: Name of the generated artifact
        required: false
        type: string
        default: l2nr-ui

permissions:
  contents: read

jobs:
  l2nr-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source project
        uses: actions/checkout@v7

      - name: Process source project
        uses: DariuszPiskorowski/l2nr-ui@main
        with:
          command: ${{ inputs.command }}
          source: .
          output: .l2nr-output

      - name: Verify browser bundle
        if: inputs.command == 'build'
        shell: bash
        run: |
          matches=$(grep -R --include='*.js' -n 'process\.env\.NODE_ENV' .l2nr-output/*/resources 2>/dev/null || true)
          if [ -n "$matches" ]; then
            echo "$matches"
            echo "Browser bundle still contains process.env.NODE_ENV"
            exit 1
          fi

      - name: Upload result
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_name }}
          path: |
            .l2nr-output/l2nr-analysis.json
            .l2nr-output/*.tgz
          if-no-files-found: warn
          include-hidden-files: true
