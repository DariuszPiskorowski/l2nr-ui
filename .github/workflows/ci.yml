name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Test
        run: npm test

      - name: Prepare action fixture
        run: cp tests/fixture/package.template.json tests/fixture/package.json

      - name: Test local action
        uses: ./
        with:
          source: tests/fixture
          output: l2nr-analysis.json

      - name: Upload analysis
        uses: actions/upload-artifact@v7
        with:
          name: l2nr-analysis
          path: l2nr-analysis.json
